<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Event Booking Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .events-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .event-card { background: white; border-radius: 10px; padding: 20px; width: 280px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .event-card h3 { color: #0078d4; margin-bottom: 10px; }
        .event-date { color: #555; font-size: 14px; margin-bottom: 15px; font-weight: bold; }
        .btn-book { background-color: #0078d4; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
        .btn-book:hover { background-color: #005a9e; }
        
        /* Modal Form */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 10px; width: 320px; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        #status-message { margin-top: 15px; padding: 10px; border-radius: 5px; display: none; text-align: center; }
        .success { background-color: #d4edda; color: #155724; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Cloud Event Discovery & Booking Portal</h1>
        <p>Select an upcoming event to reserve your seats</p>
    </div>

    <!-- Multi-Event Discovery Cards -->
    <div class="events-container">
        <div class="event-card">
            <h3>Cloud Tech Summit 2026</h3>
            <p class="event-date">📅 Date: Oct 25, 2026</p>
            <button class="btn-book" onclick="openBooking('EVT-TECH-101', 'Cloud Tech Summit 2026')">Book Tickets</button>
        </div>
        <div class="event-card">
            <h3>Grand Music Fest</h3>
            <p class="event-date">📅 Date: Nov 02, 2026</p>
            <button class="btn-book" onclick="openBooking('EVT-MUSIC-202', 'Grand Music Fest')">Book Tickets</button>
        </div>
        <div class="event-card">
            <h3>National Dance Gala</h3>
            <p class="event-date">📅 Date: Nov 15, 2026</p>
            <button class="btn-book" onclick="openBooking('EVT-DANCE-303', 'National Dance Gala')">Book Tickets</button>
        </div>
    </div>

    <!-- Booking Modal Popup -->
    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle">Book Event</h3>
            <form id="bookingForm">
                <input type="hidden" id="eventId">
                <input type="hidden" id="eventName">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="userName" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="userEmail" required>
                </div>
                <div class="form-group">
                    <label>Number of Tickets</label>
                    <input type="number" id="tickets" min="1" max="5" value="1" required>
                </div>
                <button type="submit" class="btn-book">Confirm Booking</button>
            </form>
            <div id="status-message"></div>
        </div>
    </div>

    <script>
        function openBooking(id, name) {
            document.getElementById('eventId').value = id;
            document.getElementById('eventName').value = name;
            document.getElementById('modalTitle').innerText = 'Book ' + name;
            document.getElementById('bookingModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('bookingModal').style.display = 'none';
            document.getElementById('status-message').style.display = 'none';
        }

        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusDiv = document.getElementById('status-message');
            statusDiv.style.display = 'block';
            statusDiv.className = 'success';
            statusDiv.innerText = 'Processing booking...';

            const payload = {
                eventId: document.getElementById('eventId').value,
                eventName: document.getElementById('eventName').value,
                userName: document.getElementById('userName').value,
                userEmail: document.getElementById('userEmail').value,
                tickets: Number(document.getElementById('tickets').value)
            };

            try {
                const response = await fetch('/api/ProcessRegistration', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (response.ok) {
                    statusDiv.innerText = `Success! Booking ID: ${result.booking.id}`;
                } else {
                    statusDiv.innerText = 'Booking failed. Try again.';
                }
            } catch (err) {
                statusDiv.innerText = 'Error connecting to backend.';
            }
        });
    </script>
</body>
</html>
