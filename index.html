<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Event Booking Portal</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), 
                        url('https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
            margin: 0; 
            padding: 30px 20px; 
            color: #fff;
            min-height: 100vh;
        }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 2.5rem; text-shadow: 0 2px 10px rgba(0,0,0,0.5); margin-bottom: 10px; }
        .header p { font-size: 1.1rem; color: #cbd5e1; }
        
        .events-container { 
            display: flex; 
            justify-content: center; 
            gap: 25px; 
            flex-wrap: wrap; 
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .event-card { 
            border-radius: 15px; 
            width: 320px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            height: 380px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .event-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        /* Background Images for Cards */
        .card-tech {
            background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(15, 23, 42, 0.9) 80%), 
                        url('https://images.unsplash.com/photo-1540575467063-178a50c2df87?auto=format&fit=crop&w=600&q=80') center/cover;
        }

        .card-music {
            background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(15, 23, 42, 0.9) 80%), 
                        url('https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=600&q=80') center/cover;
        }

        .card-dance {
            background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(15, 23, 42, 0.9) 80%), 
                        url('https://images.unsplash.com/photo-1547153760-18fc86324498?auto=format&fit=crop&w=600&q=80') center/cover;
        }

        .card-content {
            padding: 20px;
            text-align: center;
            margin-top: auto;
        }

        .event-card h3 { 
            font-size: 1.5rem; 
            margin-bottom: 8px; 
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .event-date { 
            color: #38bdf8; 
            font-size: 15px; 
            margin-bottom: 20px; 
            font-weight: 600; 
        }

        .btn-book { 
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px; 
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
            transition: background 0.2s;
        }

        .btn-book:hover { 
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%); 
        }
        
        /* Modal Form */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.7); 
            backdrop-filter: blur(5px);
            justify-content: center; 
            align-items: center; 
            z-index: 1000;
        }

        .modal-content { 
            background: #1e293b; 
            color: #f8fafc;
            padding: 30px; 
            border-radius: 12px; 
            width: 340px; 
            position: relative; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid #334155;
        }

        .close-btn { 
            position: absolute; 
            top: 15px; 
            right: 20px; 
            cursor: pointer; 
            font-size: 24px; 
            color: #94a3b8;
        }

        .close-btn:hover { color: #fff; }

        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; color: #cbd5e1; }
        .form-group input { 
            width: 100%; 
            padding: 10px; 
            box-sizing: border-box; 
            border: 1px solid #475569; 
            border-radius: 6px; 
            background-color: #0f172a;
            color: #fff;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #38bdf8;
        }

        #status-message { 
            margin-top: 15px; 
            padding: 12px; 
            border-radius: 6px; 
            display: none; 
            text-align: center; 
            font-size: 14px;
        }

        .success { background-color: #065f46; color: #a7f3d0; border: 1px solid #059669; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Cloud Event Discovery & Booking Portal</h1>
        <p>Explore upcoming events and reserve your seats instantly</p>
    </div>

    <!-- Multi-Event Discovery Cards -->
    <div class="events-container">
        <!-- Tech Event -->
        <div class="event-card card-tech">
            <div class="card-content">
                <h3>Cloud Tech Summit 2026</h3>
                <p class="event-date">📅 Date: Oct 25, 2026</p>
                <button class="btn-book" onclick="openBooking('EVT-TECH-101', 'Cloud Tech Summit 2026')">Book Tickets</button>
            </div>
        </div>

        <!-- Music Event -->
        <div class="event-card card-music">
            <div class="card-content">
                <h3>Grand Music Fest</h3>
                <p class="event-date">📅 Date: Nov 02, 2026</p>
                <button class="btn-book" onclick="openBooking('EVT-MUSIC-202', 'Grand Music Fest')">Book Tickets</button>
            </div>
        </div>

        <!-- Dance Event -->
        <div class="event-card card-dance">
            <div class="card-content">
                <h3>National Dance Gala</h3>
                <p class="event-date">📅 Date: Nov 15, 2026</p>
                <button class="btn-book" onclick="openBooking('EVT-DANCE-303', 'National Dance Gala')">Book Tickets</button>
            </div>
        </div>
    </div>

    <!-- Booking Modal Popup -->
    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle" style="margin-top: 0; color: #38bdf8;">Book Event</h3>
            <form id="bookingForm">
                <input type="hidden" id="eventId">
                <input type="hidden" id="eventName">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="userName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="userEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Number of Tickets</label>
                    <input type="number" id="tickets" min="1" max="5" value="1" required>
                </div>
                <button type="submit" class="btn-book">Confirm Booking</button>
            </form>
            <div id="status-message"></div>
        </div>
    </div>

    <script>
        function openBooking(id, name) {
            document.getElementById('eventId').value = id;
            document.getElementById('eventName').value = name;
            document.getElementById('modalTitle').innerText = 'Book ' + name;
            document.getElementById('bookingModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('bookingModal').style.display = 'none';
            document.getElementById('status-message').style.display = 'none';
        }

        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusDiv = document.getElementById('status-message');
            statusDiv.style.display = 'block';
            statusDiv.className = 'success';
            statusDiv.innerText = 'Processing booking...';

            const payload = {
                eventId: document.getElementById('eventId').value,
                eventName: document.getElementById('eventName').value,
                userName: document.getElementById('userName').value,
                userEmail: document.getElementById('userEmail').value,
                tickets: Number(document.getElementById('tickets').value)
            };

            try {
                const response = await fetch('/api/ProcessRegistration', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (response.ok) {
                    statusDiv.innerText = `Success! Booking ID: ${result.booking.id}`;
                } else {
                    statusDiv.innerText = 'Booking failed. Try again.';
                }
            } catch (err) {
                statusDiv.innerText = 'Error connecting to backend.';
            }
        });
    </script>
</body>
</html>
